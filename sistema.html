  let redesenhar = true

  switch (acao) {
    case 'aliquota': n.aliquotaSimples = fracaoDeCampo(el.value); break
    case 'prolabore': n.proLabore = numeroDeCampo(el.value); break
    case 'horas': n.horasTrabalhadas = numeroDeCampo(el.value); break
    case 'deslocamento': n.deslocamento = numeroDeCampo(el.value); break
    case 'orcamentos': n.orcamentosNaoFechados = numeroDeCampo(el.value); break
    case 'administracao': n.administracao = numeroDeCampo(el.value); break
    case 'margem-padrao': n.margemPadrao = fracaoDeCampo(el.value); break
    case 'margem-minima': n.margemMinima = fracaoDeCampo(el.value); break
    case 'fixo-desc': n.custosFixos[i].descricao = el.value; break
    case 'fixo-valor': n.custosFixos[i].valor = numeroDeCampo(el.value); break

    case 'canal-nome': ui.canalNome = el.value; redesenhar = false; break
    case 'canal-taxa': ui.canalTaxa = el.value; redesenhar = false; break
    case 'canal-fixo': ui.canalFixo = el.value; redesenhar = false; break
    case 'canal-itens': ui.canalItens = el.value; redesenhar = false; break

    case 'ins-nome': ins.nome = el.value; redesenhar = false; break
    case 'ins-qtd': ins.quantidadeEmbalagem = numeroDeCampo(el.value); break
    case 'ins-preco': ins.precoEmbalagem = numeroDeCampo(el.value); break
    case 'ins-fornecedor': ins.fornecedor = el.value; redesenhar = false; break

    case 'fic-nome': f.nome = el.value; redesenhar = false; break
    case 'fic-rendimento': f.rendimento = numeroDeCampo(el.value) || 1; break
    case 'fic-embalagem': f.custoEmbalagemUnitario = numeroDeCampo(el.value); break
    case 'fic-perda': f.indicePerda = fracaoDeCampo(el.value); break
    case 'fic-tempo': f.tempoProducaoHoras = numeroDeCampo(el.value); break
    case 'fic-margem': f.margemDesejada = fracaoDeCampo(el.value); break
    case 'item-qtd': f.itens[i].quantidade = numeroDeCampo(el.value); break
    case 'item-quantidade': ui.itemQtd = el.value; redesenhar = false; break
    case 'mat-desc': f.materiais[i].descricao = el.value; redesenhar = false; break
    case 'mat-custo': f.materiais[i].custo = numeroDeCampo(el.value); break
    case 'mat-margem': f.materiais[i].margem = fracaoDeCampo(el.value); break

    case 'preco-praticado': {
      const ficha = dados.fichas.filter(x => x.id === ui.fichaPreco)[0]
      ficha.precosPraticados = ficha.precosPraticados || {}
      if (el.value.trim() === '') delete ficha.precosPraticados[el.dataset.chave]
      else ficha.precosPraticados[el.dataset.chave] = numeroDeCampo(el.value)
      salvar()
      break
    }

    case 'sim-desconto': ui.desconto = el.value; break
    case 'sim-alta': ui.alta = el.value; break
    case 'sim-taxa': ui.novaTaxa = el.value; break
    case 'sim-retirada': ui.retirada = el.value; break

    case 'backup-texto': ui.textoColado = el.value; redesenhar = false; break
    case 'nome-negocio': dados.negocio.nome = el.value; salvar(); break

    default: redesenhar = false
  }

  if (['aliquota','prolabore','horas','deslocamento','orcamentos','administracao',
       'margem-padrao','margem-minima','fixo-desc','fixo-valor'].indexOf(acao) >= 0) salvar()

  if (redesenhar) render()
})

/* ---- selects e rádios ---- */

document.addEventListener('change', function (e) {
  const el = e.target
  const acao = el.dataset.acao
  if (!acao) return
  if (el.tagName === 'INPUT' && el.type === 'text') { setTimeout(render, 0); return }

  switch (acao) {
    case 'porte':
      dados.negocio.porte = el.dataset.chave
      salvar(); render(); break
    case 'ins-unidade': ui.insumoAberto.unidade = el.value; render(); break
    case 'fic-tipo': ui.fichaAberta.tipo = el.dataset.chave; render(); break
    case 'item-escolher': ui.itemInsumo = el.value; render(); break
    case 'preco-ficha': ui.fichaPreco = el.value; render(); break
    case 'sim-ficha': ui.simFicha = el.value; ui.simCanal = null; ui.simInsumo = null; render(); break
    case 'sim-canal': ui.simCanal = el.value; render(); break
    case 'sim-insumo': ui.simInsumo = el.value; render(); break
    case 'tabela-canal': ui.tabelaCanal = el.value; render(); break
    case 'tabela-preco': ui.tabelaPreco = el.dataset.chave; render(); break
  }
})

/* ---- botões ---- */

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-acao]')
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return
  const acao = el.dataset.acao
  const chave = el.dataset.chave
  const i = el.dataset.indice
  const n = dados.negocio
  const f = fichaEmEdicao()

  switch (acao) {
    case 'ir': location.hash = chave; return

    /* base */
    case 'fixo-novo': n.custosFixos.push({ descricao: '', valor: 0 }); break
    case 'fixo-remover': n.custosFixos.splice(i, 1); break
    case 'canal-novo': {
      if (!ui.canalNome) { avisar('Dê um nome para o canal.'); focar('canal-nome'); return }
      dados.canais.push({
        id: novoId(), nome: ui.canalNome,
        taxa: fracaoDeCampo(ui.canalTaxa || '0'),
        custoFixoPorPedido: numeroDeCampo(ui.canalFixo || '0'),
        itensPorPedido: numeroDeCampo(ui.canalItens || '1') || 1
      })
      ui.canalNome = ''; ui.canalTaxa = ''; ui.canalFixo = ''; ui.canalItens = '1'
      break
    }
    case 'canal-remover': dados.canais = dados.canais.filter(c => c.id !== chave); break

    /* insumos */
    case 'insumo-novo':
      abrirInsumo({ id: null, nome: '', unidade: 'g', quantidadeEmbalagem: 0, precoEmbalagem: 0, fornecedor: '', historico: [] })
      break
    case 'insumo-abrir':
      abrirInsumo(JSON.parse(JSON.stringify(dados.insumos.filter(x => x.id === chave)[0])))
      break
    case 'insumo-fechar':
      if (editorSujo()) { ui.destinoPendente = null; perguntarSair(); break }
      fecharEditores(); break
    case 'insumo-excluir':
      perguntar('Excluir ' + (ui.insumoAberto.nome || 'este insumo') + '?',
        'Ele também sai de todas as fichas que o usam.', 'Excluir', 'insumo-excluir-sim')
      break
    case 'insumo-excluir-sim':
      ui.pergunta = null
      dados.insumos = dados.insumos.filter(x => x.id !== ui.insumoAberto.id)
      dados.fichas.forEach(fi => {
        fi.itens = (fi.itens || []).filter(it => it.insumoId !== ui.insumoAberto.id)
      })
      fecharEditores()
      break
    case 'insumo-salvar': {
      const novo = ui.insumoAberto
      if (!novo.nome) { avisar('Dê um nome para o insumo.'); focar('ins-nome'); return }
      const antigo = novo.id ? dados.insumos.filter(x => x.id === novo.id)[0] : null
      if (antigo && antigo.precoEmbalagem !== novo.precoEmbalagem) {
        const afetadas = fichasAfetadas(novo.id, novo.precoEmbalagem)
        if (afetadas.length) {
          ui.impacto = {
            nome: novo.nome,
            variacao: variacao(antigo.precoEmbalagem, novo.precoEmbalagem),
            fichas: afetadas
          }
          break
        }
      }
      gravarInsumo(novo)
      fecharEditores()
      avisar('Insumo salvo.')
      break
    }
    case 'impacto-confirmar':
      gravarInsumo(ui.insumoAberto)
      fecharEditores()
      avisar('Preço atualizado nas fichas.')
      break
    case 'impacto-cancelar': ui.impacto = null; break

    /* fichas */
    case 'ficha-nova': abrirFicha(fichaVazia()); break
    case 'ficha-abrir':
      abrirFicha(JSON.parse(JSON.stringify(dados.fichas.filter(x => x.id === chave)[0])))
      break
    case 'ficha-fechar':
      if (editorSujo()) { ui.destinoPendente = null; perguntarSair(); break }
      fecharEditores(); break
    case 'ficha-excluir':
      perguntar('Excluir ' + (ui.fichaAberta.nome || 'esta ficha') + '?',
        'A ficha e os preços cadastrados nela serão apagados.', 'Excluir', 'ficha-excluir-sim')
      break
    case 'ficha-excluir-sim':
      ui.pergunta = null
      dados.fichas = dados.fichas.filter(x => x.id !== ui.fichaAberta.id)
      fecharEditores()
      break
    case 'ficha-salvar': {
      if (!f.nome) { avisar('Dê um nome para a ficha.'); focar('fic-nome'); return }
      gravarFicha(f)
      fecharEditores()
      avisar('Ficha salva.')
      break
    }

    /* respostas do "Sair sem salvar?" */
    case 'sair-salvar': {
      ui.pergunta = null
      const qual = editorSujo()
      if (!salvarEditorAberto()) {
        ui.destinoPendente = null
        salvar(); render()
        focar(qual === 'insumo' ? 'ins-nome' : 'fic-nome')
        return
      }
      salvar()
      irDestinoPendente()
      break
    }
    case 'sair-descartar':
      ui.pergunta = null
      fecharEditores()
      irDestinoPendente()
      break
    case 'sair-ficar': ui.pergunta = null; ui.destinoPendente = null; break
    case 'item-adicionar': {
      if (!ui.itemInsumo) { avisar('Escolha o insumo na lista.'); return }
      const insumo = insumosPorId()[ui.itemInsumo]
      f.itens.push({ insumoId: insumo.id, quantidade: numeroDeCampo(ui.itemQtd || '0'), unidade: insumo.unidade })
      ui.itemInsumo = ''; ui.itemQtd = ''
      break
    }
    case 'item-remover': f.itens.splice(i, 1); break
    case 'mat-novo': f.materiais.push({ descricao: '', custo: 0, margem: 0.2 }); break
    case 'mat-remover': f.materiais.splice(i, 1); break

    /* preços */
    case 'abrir-precos': ui.fichaPreco = chave; location.hash = 'precos'; return
    case 'reajustado': {
      const ficha = dados.fichas.filter(x => x.id === ui.fichaPreco)[0]
      ficha.custoNoUltimoReajuste = calcularFicha(ficha).custoUnitario
      ficha.ultimoReajuste = new Date().toISOString()
      break
    }

    /* simulador */
    case 'cenario': ui.cenario = chave; break

    /* modelos prontos ("exemplo" continua valendo: é o modelo da confeitaria) */
    case 'exemplo':
    case 'modelo': {
      const qual = acao === 'exemplo' ? 'confeitaria' : chave
      ui.modeloPendente = qual
      if (!dados.exemplo && (dados.fichas.length || dados.insumos.length)) {
        perguntar('Usar o modelo ' + MODELOS[qual].titulo.toLowerCase() + '?',
          'Isto apaga o que está cadastrado neste aparelho. Se quiser guardar, faça um backup antes.',
          'Usar o modelo', 'modelo-sim')
        break
      }
      fecharEditores()
      carregarModelo(qual)
      avisar('Modelo carregado: ' + MODELOS[qual].titulo.toLowerCase() + '.')
      location.hash = 'painel'
      break
    }
    case 'exemplo-sim':
    case 'modelo-sim': {
      ui.pergunta = null
      const qual = ui.modeloPendente || 'confeitaria'
      fecharEditores()
      carregarModelo(qual)
      avisar('Modelo carregado: ' + MODELOS[qual].titulo.toLowerCase() + '.')
      location.hash = 'painel'
      break
    }
    case 'modelo-assumir':
      dados.exemplo = false
      delete dados.modelo
      avisar('Pronto, agora é seu. Troque os números pelos do seu negócio, começando pela Base.')
      break
    case 'apagar':
      perguntar('Apagar tudo?', 'Base, canais, insumos e fichas deste aparelho serão apagados. ' +
        'Se quiser guardar, faça um backup antes.', 'Apagar tudo', 'apagar-sim')
      break
    case 'apagar-sim':
      ui.pergunta = null
      fecharEditores()
      dados = { negocio: Object.assign({}, NEGOCIO_PADRAO), canais: [], insumos: [], fichas: [] }
      ui.mensagem = 'Tudo apagado.'
      break
    case 'comecar-meu':
      perguntar('Começar em branco?',
        'Os números do modelo saem deste aparelho e todos os campos ficam em branco para você ' +
        'preencher, começando pela base do negócio.', 'Começar em branco', 'comecar-meu-sim')
      break
    case 'comecar-meu-sim':
      ui.pergunta = null
      fecharEditores()
      dados = { negocio: Object.assign({}, NEGOCIO_PADRAO), canais: [], insumos: [], fichas: [] }
      salvar()
      avisar('Campos em branco. Comece pela base do negócio.')
      location.hash = 'base'
      window.scrollTo(0, 0)
      break
    case 'pergunta-cancelar': ui.pergunta = null; break

    case 'backup-baixar': baixarBackup(); return
    case 'backup-copiar': copiarBackup(); return
    case 'tabela-copiar': copiarTabela(); return
    case 'backup-restaurar': document.getElementById('arquivo-backup').click(); return
    case 'backup-colar': ui.colando = true; ui.mostrarBackup = false; ui.mensagem = null; render(); focar('backup-texto'); return
    case 'backup-colar-cancelar': ui.colando = false; ui.textoColado = ''; break
    case 'backup-colar-ok':
      if (!(ui.textoColado || '').trim()) { avisar('Cole o texto do backup primeiro.'); focar('backup-texto'); return }
      if (restaurarDeTexto(ui.textoColado)) { ui.colando = false; ui.textoColado = '' }
      render()
      return

    default: return
  }

  salvar()
  render()
})

/* ---- propagação automática de preço ---- */

function fichasAfetadas (insumoId, novoPreco) {
  const insumo = insumosPorId()[insumoId]
  if (!insumo) return []
  const sub = {}
  sub[insumoId] = Object.assign({}, insumo, { precoEmbalagem: novoPreco })
  return dados.fichas
    .filter(f => (f.itens || []).some(it => it.insumoId === insumoId))
    .map(f => ({
      nome: f.nome,
      antes: calcularFicha(f).custoUnitario,
      depois: calcularFicha(f, sub).custoUnitario
    }))
}

function gravarInsumo (novo) {
  const agora = new Date().toISOString()
  novo.atualizadoEm = agora
  novo.historico = novo.historico || []
  if (novo.id) {
    const antigo = dados.insumos.filter(x => x.id === novo.id)[0]
    if (antigo && antigo.precoEmbalagem !== novo.precoEmbalagem) {
      novo.historico.push({ preco: novo.precoEmbalagem, data: agora })
    }
    dados.insumos = dados.insumos.map(x => x.id === novo.id ? novo : x)
  } else {
    novo.id = novoId()
    novo.historico.push({ preco: novo.precoEmbalagem, data: agora })
    dados.insumos.push(novo)
  }
}

/* ---- backup ---- */

/* Dentro do Claude (navegador ou app de celular) o download comum é
   bloqueado; o recurso "downloads" do Claude faz o papel: no iPhone abre a
   folha de compartilhar, no Android grava o arquivo. Fora do Claude, vale o
   download normal do navegador. Copiar o texto funciona em todos. */
let downloads = null
let downloadsPedido = false
function iniciarDownloads () {
  if (downloadsPedido) return
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      downloadsPedido = true
      window.claude.use('downloads').then(function (d) {
        downloads = d
        if (rotaAtual() === 'ajustes') render()
      }).catch(function () { /* sem o recurso: fica o copiar/colar */ })
    }
  } catch (e) { /* idem */ }
}
iniciarDownloads()
window.addEventListener('load', iniciarDownloads)

function dentroDeMoldura () {
  try { return window.self !== window.top } catch (e) { return true }
}

function podeBaixar () {
  return Boolean(downloads) || !dentroDeMoldura()
}

function nomeDoBackup () {
  return 'etiqueta-backup-' + new Date().toISOString().slice(0, 10) + '.json'
}

function textoDoBackup () {
  return JSON.stringify({
    aplicativo: 'etiqueta', versao: 1,
    geradoEm: new Date().toISOString(), dados: dados
  }, null, 2)
}

function baixarBackup () {
  const texto = textoDoBackup()
  const nome = nomeDoBackup()

  if (downloads) {
    downloads.save({ filename: nome, data: texto }).then(function () {
      ui.mensagem = 'Backup salvo: ' + nome + '.'
      render()
    }, function (erro) {
      ui.mensagem = erro && erro.code === 'declined'
        ? 'Backup não salvo.'
        : 'Não deu para baixar aqui. Use "Copiar backup".'
      render()
    })
    return
  }

  try {
    const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }))
    const a = document.createElement('a')
    a.href = url
    a.download = nome
    document.body.appendChild(a)
    a.click()
    a.remove()
    /* o Safari do iPhone ainda lê a URL depois do clique: não revogar na hora */
    setTimeout(function () { URL.revokeObjectURL(url) }, 60000)
    ui.mensagem = 'Backup baixado: ' + nome + '.'
  } catch (e) {
    ui.mensagem = 'Não deu para baixar aqui. Use "Copiar backup".'
  }
  render()
}

function copiarBackup () {
  const texto = textoDoBackup()
  const mostrar = function () {
    ui.mostrarBackup = true
    ui.colando = false
    ui.mensagem = null
    render()
    const campo = document.querySelector('[data-foco="backup-mostrar"]')
    if (campo) {
      try { campo.focus(); campo.setSelectionRange(0, campo.value.length) } catch (e) { /* ok */ }
    }
  }
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('sem área de transferência')
    navigator.clipboard.writeText(texto).then(function () {
      ui.mostrarBackup = false
      ui.mensagem = 'Backup copiado. Cole num e-mail, no WhatsApp para você mesmo ou nas Notas para guardar.'
      render()
    }, mostrar)
  } catch (e) {
    mostrar()
  }
}

function restaurarDeTexto (texto) {
  try {
    let backup
    try { backup = JSON.parse(String(texto).trim()) } catch (e) {
      throw new Error('Isto não parece um backup do Etiqueta. Confira se copiou o texto inteiro.')
    }
    if (!backup || backup.aplicativo !== 'etiqueta' || !backup.dados) {
      throw new Error('Este arquivo não é um backup do Etiqueta.')
    }
    const d = backup.dados
    d.negocio = Object.assign({}, NEGOCIO_PADRAO, d.negocio)
    d.canais = d.canais || []
    d.insumos = d.insumos || []
    d.fichas = d.fichas || []
    if (d.exemplo === undefined) d.exemplo = pareceExemplo(d)
    if (d.exemplo && !d.modelo) d.modelo = 'confeitaria'
    dados = d
    salvar()
    ui.mensagem = 'Backup restaurado.'
    return true
  } catch (erro) {
    ui.mensagem = erro.message
    return false
  }
}

document.addEventListener('change', function (e) {
  if (e.target.id !== 'arquivo-backup') return
  const arquivo = e.target.files[0]
  if (!arquivo) return
  const leitor = new FileReader()
  leitor.onload = function () {
    restaurarDeTexto(leitor.result)
    e.target.value = ''
    render()
  }
  leitor.onerror = function () {
    ui.mensagem = 'Não foi possível ler o arquivo.'
    render()
  }
  leitor.readAsText(arquivo)
})

/* ---- teclado do celular ---- */

function ehCampoDeDigitar (el) {
  if (!el) return false
  if (el.tagName === 'TEXTAREA') return true
  return el.tagName === 'INPUT' && ['text', 'number', 'search', 'email', 'tel'].indexOf(el.type) >= 0
}

/* esconde a barra de baixo enquanto o teclado está aberto (ver CSS) */
document.addEventListener('focusin', function (e) {
  if (ehCampoDeDigitar(e.target)) document.body.classList.add('digitando')
})
document.addEventListener('focusout', function () {
  setTimeout(function () {
    if (!ehCampoDeDigitar(document.activeElement)) document.body.classList.remove('digitando')
  }, 60)
})

/* "OK"/"Concluído" do teclado fecha o teclado; Esc fecha o diálogo */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ui.pergunta) { ui.pergunta = null; render(); return }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'text' && !e.isComposing) {
    e.preventDefault()
    e.target.blur()
  }
})

let rotaMostrada = rotaAtual()
let ignorarHash = false

window.addEventListener('hashchange', function () {
  if (ignorarHash) { ignorarHash = false; return }
  if (editorSujo()) {
    /* volta o endereço para o editor e pergunta antes de sair */
    ui.destinoPendente = rotaAtual()
    try {
      history.pushState(null, '', '#' + rotaMostrada)
    } catch (e) {
      ignorarHash = true
      location.hash = rotaMostrada
    }
    perguntarSair()
    render()
    return
  }
  rotaMostrada = rotaAtual()
  fecharEditores()
  ui.mensagem = null
  ui.pergunta = null
  ui.colando = false
  ui.mostrarBackup = false
  render()
})

/* fechar a aba ou recarregar com ficha não salva: o navegador pergunta */
window.addEventListener('beforeunload', function (e) {
  if (!editorSujo()) return
  e.preventDefault()
  e.returnValue = ''
})

render()
</script>
